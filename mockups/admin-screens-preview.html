<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin Dashboard – Screen Previews</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#F3F4F6;--s:#fff;--fg:#111;--mut:#6B7280;--card:#F3F4F6;--ln:#E5E7EB;--pri:#111;--pf:#fff;--ok:#06A35A;--okb:#E3F6EC;--wn:#B7791F;--wnb:#FBF1DC;--er:#D92D20;--erb:#FDECEA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D0F12;--s:#181B20;--fg:#F5F5F5;--mut:#9AA3AF;--card:#242830;--ln:#2F343C;--pri:#F5F5F5;--pf:#111;--ok:#2ECC85;--okb:#12301F;--wn:#F6C453;--wnb:#3A2F12;--er:#FF6B5E;--erb:#3C1A17}}
:root[data-theme="dark"]{--bg:#0D0F12;--s:#181B20;--fg:#F5F5F5;--mut:#9AA3AF;--card:#242830;--ln:#2F343C;--pri:#F5F5F5;--pf:#111;--ok:#2ECC85;--okb:#12301F;--wn:#F6C453;--wnb:#3A2F12;--er:#FF6B5E;--erb:#3C1A17}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{background:var(--s);border-right:1px solid var(--ln);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;align-self:start;height:100vh}
.br{display:flex;align-items:center;gap:10px;padding:0 10px 18px;font-weight:700;font-size:15px}.lg{width:34px;height:34px;border-radius:9px;background:var(--pri);color:var(--pf);display:grid;place-items:center;font-size:9px;font-weight:600}
.side a{color:var(--mut);text-decoration:none;padding:10px 12px;border-radius:10px;font-weight:500}.side a.on{background:var(--card);color:var(--fg);font-weight:700}
main{padding:28px 32px;display:flex;flex-direction:column;gap:20px;min-width:0}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.hd h1{font-size:26px}.hd p{color:var(--mut)}
.btn{background:var(--pri);color:var(--pf);border-radius:10px;padding:10px 16px;font-weight:600;font-size:13px;display:inline-block}.btn.o{background:var(--s);color:var(--fg);border:1px solid var(--ln)}.btn.d{background:var(--er);color:#fff}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.st div,.card{background:var(--s);border:1px solid var(--ln);border-radius:14px;padding:16px}.st small{color:var(--mut)}.st b{display:block;font-size:26px;margin-top:2px}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:16px}.g2e{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
h3{font-size:15px;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--s);border:1px solid var(--ln);padding:7px 14px;border-radius:99px;font-size:13px;font-weight:500}.chip.on{background:var(--pri);color:var(--pf);border-color:var(--pri)}
.tw{overflow-x:auto;background:var(--s);border:1px solid var(--ln);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:640px}th{text-align:left;color:var(--mut);font-weight:500;font-size:12px;padding:12px 14px;border-bottom:1px solid var(--ln);background:var(--card)}td{padding:12px 14px;border-bottom:1px solid var(--ln);white-space:nowrap}tr:last-child td{border-bottom:0}
.b{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--card);color:var(--mut)}.b.ok{background:var(--okb);color:var(--ok)}.b.wn{background:var(--wnb);color:var(--wn)}.b.er{background:var(--erb);color:var(--er)}
.bars{display:flex;align-items:flex-end;gap:12px;height:160px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%;color:var(--mut);font-size:12px}.bars i{display:block;width:100%;background:var(--card);border-radius:8px}.bars i.on{background:var(--pri)}
.li{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--ln)}.li:last-child{border:0}
.tk{padding:12px;border-radius:12px;border:1px solid var(--ln);display:flex;flex-direction:column;gap:4px}.tk.on{background:var(--card);border-color:var(--pri)}
.msg{background:var(--card);border-radius:12px;padding:12px 14px;max-width:85%;margin-bottom:10px}.msg.me{background:var(--pri);color:var(--pf);margin-left:auto}.msg small{opacity:.7;display:block;margin-bottom:2px}
.tl{display:flex;gap:10px;padding:8px 0}.tl i{width:10px;height:10px;border-radius:50%;background:var(--pri);margin-top:5px;flex:none}.tl i.m{background:var(--ln)}
.rep{background:var(--card);border-radius:12px;padding:14px;color:var(--mut);height:70px;margin-top:8px}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px}.br{display:none}.side a{white-space:nowrap}main{padding:20px 16px}.g2,.g2e{grid-template-columns:1fr}}
</style></head><body>
<div class="app"><nav class="side" id="nav"><div class="br"><div class="lg">Logo</div>Admin</div></nav><main id="main"></main></div>
<script>
var bd=function(t,k){return '<span class="b '+(k||'')+'">'+t+'</span>'};
var tb=function(h,r){return '<div class="tw"><table><tr>'+h.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr>'+r.map(function(x){return '<tr>'+x.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>'};
var st=function(a){return '<div class="st">'+a.map(function(x){return '<div><small>'+x[0]+'</small><b>'+x[1]+'</b></div>'}).join('')+'</div>'};
var ch=function(a,i){return '<div class="chips">'+a.map(function(x,n){return '<span class="chip'+(n==i?' on':'')+'">'+x+'</span>'}).join('')+'</div>'};
var hd=function(t,s,b){return '<div class="hd"><div><h1>'+t+'</h1><p>'+s+'</p></div>'+(b?'<span class="btn">'+b+'</span>':'')+'</div>'};
var S={
dashboard:function(){var v=[620,710,680,790,842,560,480],d=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];return hd('Dashboard','Operations overview for today','Export report')+st([['Trips today','842'],['Drivers online','312'],['Pending applications','27'],['Revenue today','$18,420']])+'<div class="g2"><div class="card"><h3>Trips this week</h3><div class="bars">'+v.map(function(x,i){return '<div><i class="'+(i==4?'on':'')+'" style="height:'+x/842*100+'%"></i>'+d[i]+'</div>'}).join('')+'</div></div><div class="card"><h3>Needs attention</h3><div class="li"><span>Insurance expiring within 14 days</span>'+bd('12','wn')+'</div><div class="li"><span>Payouts on hold</span>'+bd('4','er')+'</div><div class="li"><span>Open complaints</span>'+bd('9','wn')+'</div><div class="li"><span>Applications waiting over 48 hrs</span>'+bd('6','wn')+'</div></div></div><div><h3>Live trips</h3>'+tb(['Trip','Driver','Route','Type','Status'],[['#8841','Daniel O.','Palm St → Airport T2','Hourly',bd('In progress','ok')],['#8840','Sara B.','Market Rd → City Mall','Airport',bd('Arriving','wn')],['#8839','Chidi E.','Harbour → Office Park','Daily',bd('In progress','ok')]])+'</div>'},
drivers:function(){return hd('Drivers','Everyone driving on the platform','+ Add driver')+ch(['All','Online','Pending','Suspended'],0)+tb(['Driver','Vehicle','Rating','Trips','Documents','Status'],[['<b>Daniel Okafor</b>','Camry · ABC-123','4.9','412',bd('Insurance due','wn'),bd('Online','ok')],['<b>Chidi Eze</b>','Corolla · KJA-882','4.7','230',bd('Valid','ok'),bd('Offline')],['<b>Sara Bello</b>','Highlander · LND-407','4.8','96',bd('Valid','ok'),bd('Online','ok')],['<b>Tunde Ade</b>','Accord · EKY-115','3.9','58',bd('Expired','er'),bd('Suspended','er')]])},
applications:function(){return hd('Applications','Review new driver applications')+st([['Pending','27'],['Under review','11'],['Approved this week','34'],['Rejected this week','5']])+ch(['Pending','Under review','Approved','Rejected'],0)+tb(['Applicant','Vehicle','Submitted','Documents','Status',''],[['<b>Femi Adams</b>','Accord · EKY-220','Sep 26','3 of 4 verified',bd('Needs review','wn'),'<span class="btn o">Review</span>'],['<b>Grace Obi</b>','Sorento · ABJ-331','Sep 26','4 of 4 verified',bd('Ready to approve','ok'),'<span class="btn o">Review</span>'],['<b>Musa Bello</b>','Corolla · LKJ-554','Sep 25','2 of 4 verified',bd('Missing documents','er'),'<span class="btn o">Review</span>'],['<b>Ada Nwosu</b>','Camry · KRD-219','Sep 25','4 of 4 verified',bd('Background check','wn'),'<span class="btn o">Review</span>']])},
vehicles:function(){return hd('Vehicles','Fleet and vehicle documents','+ Add vehicle')+st([['Total vehicles','1,102'],['Active','968'],['In service','41'],['Documents expired','19']])+ch(['All','Active','In service','Expired documents'],0)+tb(['Vehicle','Plate','Category','Driver','Insurance expiry','Status'],[['<b>Toyota Camry 2019</b>','ABC-123','Sedan','Daniel O.',bd('12 days left','wn'),bd('Active','ok')],['<b>Toyota Corolla 2020</b>','KJA-882','Economy','Chidi E.',bd('8 months','ok'),bd('Active','ok')],['<b>Toyota Highlander 2021</b>','LND-407','SUV','Sara B.',bd('5 months','ok'),bd('In service','wn')],['<b>Honda Accord 2018</b>','EKY-115','Sedan','Tunde A.',bd('Expired','er'),bd('Blocked','er')]])},
trips:function(){return hd('Trips','All rides and hires','Export')+ch(['All','Live','Completed','Cancelled'],0)+'<div class="g2e">'+tb(['Trip','Rider','Driver','Type','Fare','Status'],[['#8841','Amaka E.','Daniel O.','Hourly','$76',bd('In progress','ok')],['#8840','John K.','Sara B.','Airport','$38',bd('Arriving','wn')],['#8832','Ngozi A.','Chidi E.','Daily','$210',bd('Completed')],['#8829','Peter L.','Tunde A.','Hourly','$0',bd('Cancelled','er')]])+'<div class="card"><h3>Trip #8841</h3><div class="tl"><i></i><div><b>Booked</b><br><span style="color:var(--mut)">2:05 PM · 4 hr hire</span></div></div><div class="tl"><i></i><div><b>Driver assigned</b><br><span style="color:var(--mut)">2:06 PM · Daniel O.</span></div></div><div class="tl"><i></i><div><b>Pickup</b><br><span style="color:var(--mut)">2:30 PM · 12 Palm Street</span></div></div><div class="tl"><i class="m"></i><div><b>Drop-off</b><br><span style="color:var(--mut)">Airport Terminal 2</span></div></div><div class="li"><span>Base fare</span><span>$60.00</span></div><div class="li"><span>Taxes and fees</span><span>$16.00</span></div><div class="li"><b>Total</b><b>$76.00</b></div></div></div>'},
payouts:function(){return hd('Payouts','Driver earnings and payments','Approve all ready')+st([['Ready to pay','$12,480'],['Paid this week','$48,220'],['On hold','4 drivers'],['Next payout run','Friday']])+ch(['Ready','On hold','Paid'],0)+tb(['Driver','Period','Trips','Gross','Fees','Net','Status',''],[['<b>Daniel Okafor</b>','Sep 21 – 27','31','$512.30','$61.50','$450.80',bd('Ready','ok'),'<span class="btn o">Approve</span>'],['<b>Sara Bello</b>','Sep 21 – 27','24','$388.00','$46.60','$341.40',bd('Ready','ok'),'<span class="btn o">Approve</span>'],['<b>Tunde Ade</b>','Sep 21 – 27','9','$140.00','$16.80','$123.20',bd('On hold','er'),'<span class="btn o">Review</span>'],['<b>Chidi Eze</b>','Sep 14 – 20','28','$455.10','$54.60','$400.50',bd('Paid'),'']])},
support:function(){return hd('Support','Complaints and enquiries from riders and drivers')+'<div class="g2e" style="grid-template-columns:1fr 1.6fr"><div style="display:flex;flex-direction:column;gap:10px">'+ch(['Open 9','Pending','Resolved'],0)+'<div class="tk on"><div style="display:flex;justify-content:space-between"><b>Overcharged on trip #8832</b>'+bd('High','er')+'</div><small style="color:var(--mut)">Rider · Ngozi A. · 12 min ago</small></div><div class="tk"><div style="display:flex;justify-content:space-between"><b>Payout not received</b>'+bd('Medium','wn')+'</div><small style="color:var(--mut)">Driver · Chidi E. · 1 hr ago</small></div><div class="tk"><div style="display:flex;justify-content:space-between"><b>Lost item in vehicle</b>'+bd('Low')+'</div><small style="color:var(--mut)">Rider · John K. · 3 hrs ago</small></div></div><div class="card"><div class="hd"><div><h3 style="margin:0">Overcharged on trip #8832</h3><small style="color:var(--mut)">Ticket #1204 · Rider · Ngozi A.</small></div>'+bd('Open','wn')+'</div><div style="margin-top:14px"><div class="msg"><small>Ngozi A.</small>I was charged for 6 hours but the booking was for 4.</div><div class="msg me"><small>You · Support</small>Thanks for flagging this. I’m checking the trip timer now.</div><div class="msg"><small>Internal note · Driver Chidi E.</small>Rider asked for two extra stops, which added time.</div></div><div class="rep">Write a reply…</div><div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end"><span class="btn o">Escalate</span><span class="btn o">Refund</span><span class="btn">Resolve</span></div></div></div>'}
};
var N=[['dashboard','Dashboard'],['drivers','Drivers'],['applications','Applications'],['vehicles','Vehicles'],['trips','Trips'],['payouts','Payouts'],['support','Support']];
var nav=document.getElementById('nav');nav.insertAdjacentHTML('beforeend',N.map(function(n){return '<a href="#'+n[0]+'" data-n="'+n[0]+'">'+n[1]+'</a>'}).join(''));
function show(){var h=(location.hash||'#dashboard').slice(1);if(!S[h])h='dashboard';document.getElementById('main').innerHTML=S[h]();nav.querySelectorAll('a').forEach(function(a){a.classList.toggle('on',a.dataset.n===h)});window.scrollTo(0,0)}
addEventListener('hashchange',show);show();
</script></body></html>
